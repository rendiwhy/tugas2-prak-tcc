<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App - Modern UI</title>
    <style>
        /* CSS Reset & Variabel Global */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --primary: #0105f7;
            --primary-hover: #0c00f1;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --bg-color: #eef2f6;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 3rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--text-main);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        /* Main Unified Card */
        .app-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.02);
        }

        /* Form Section */
        .form-section {
            padding: 2rem;
            background-color: #fafbfc;
            border-bottom: 1px solid var(--border-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: var(--card-bg);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        /* Buttons */
        button {
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-primary { 
            background-color: var(--primary); 
            width: 100%; 
            margin-top: 0.5rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-edit { background-color: var(--warning); padding: 0.5rem 1rem; font-size: 0.85rem; border-radius: 6px;}
        .btn-edit:hover { background-color: var(--warning-hover); }

        .btn-delete { background-color: var(--danger); padding: 0.5rem 1rem; font-size: 0.85rem; border-radius: 6px;}
        .btn-delete:hover { background-color: var(--danger-hover); }

        /* Notes List Section */
        .notes-section {
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .note-item {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: background-color 0.2s;
        }

        .note-item:last-child {
            border-bottom: none;
        }

        .note-item:hover {
            background-color: #f8fafc;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .note-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .note-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
        }

        .note-body {
            font-size: 0.95rem;
            color: #475569;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .note-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-muted);
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Aplikasi Catatan</h1>
            <p>Tugas 2 Rendi Wahyu Nugroho 123230010</p>
        </div>
        
        <div class="app-card">
            
            <div class="form-section">
                <div class="form-group">
                    <input type="hidden" id="noteId">
                    <input type="text" id="judul" placeholder="Judul catatan..." required>
                    <textarea id="isi" rows="3" placeholder="Tulis isi catatanmu di sini..." required></textarea>
                    <button class="btn-primary" onclick="saveNote()" id="saveBtn">Simpan Catatan</button>
                </div>
            </div>

            <div id="notesContainer" class="notes-section">
                </div>

        </div>
    </div>

<script>
        const API_URL = 'http://localhost:3000/api/notes';
        let allNotes = [];

        document.addEventListener('DOMContentLoaded', fetchNotes);

        async function fetchNotes() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Gagal terhubung ke API');
                
                allNotes = await response.json(); 
                
                const container = document.getElementById('notesContainer');
                container.innerHTML = '';
                
                if (allNotes.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>📝 Belum ada catatan. Silakan buat catatan baru!</p></div>';
                    return;
                }

                allNotes.forEach(note => {
                    let formattedDate = 'Tanggal tidak diketahui';
                    if (note.tanggal_dibuat) {
                        const dateObj = new Date(note.tanggal_dibuat);
                        if (!isNaN(dateObj)) {
                            formattedDate = dateObj.toLocaleDateString('id-ID', { 
                                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
                                hour: '2-digit', minute: '2-digit'
                            });
                        }
                    }

                    // Render HTML untuk setiap catatan
                    container.innerHTML += `
                        <div class="note-item">
                            <div class="note-header">
                                <div>
                                    <div class="note-title">${note.judul || ''}</div>
                                    <span class="note-date">${formattedDate}</span>
                                </div>
                            </div>
                            <div class="note-body">${note.isi || ''}</div>
                            <div class="note-actions">
                                <button class="btn-edit" onclick="editNote(${note.id})">Edit</button>
                                <button class="btn-delete" onclick="deleteNote(${note.id})">Hapus</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error detail:', error);
                const container = document.getElementById('notesContainer');
                container.innerHTML = '<div class="empty-state" style="color: var(--danger);"><p>⚠️ Gagal memuat data catatan. Pastikan server backend berjalan.</p></div>';
            }
        }

        async function saveNote() {
            const id = document.getElementById('noteId').value;
            const judul = document.getElementById('judul').value;
            const isi = document.getElementById('isi').value;

            if (!judul.trim() || !isi.trim()) {
                return alert('Judul dan isi catatan tidak boleh kosong!');
            }

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ judul, isi })
                });

                document.getElementById('noteId').value = '';
                document.getElementById('judul').value = '';
                document.getElementById('isi').value = '';
                document.getElementById('saveBtn').innerHTML = 'Simpan Catatan';
                
                fetchNotes();
            } catch (error) {
                console.error('Error menyimpan catatan:', error);
                alert('Terjadi kesalahan saat menyimpan catatan. Pastikan server berjalan.');
            }
        }

        function editNote(id) {
            const note = allNotes.find(n => n.id === id);
            
            if (note) {
                document.getElementById('noteId').value = note.id;
                document.getElementById('judul').value = note.judul;
                document.getElementById('isi').value = note.isi;
                document.getElementById('saveBtn').innerHTML = 'Update Catatan';
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
                document.getElementById('judul').focus();
            }
        }

        async function deleteNote(id) {
            if (confirm('Apakah kamu yakin ingin menghapus catatan ini?')) {
                try {
                    await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    fetchNotes();
                } catch (error) {
                    console.error('Error menghapus catatan:', error);
                }
            }
        }
    </script>
</body>
</html>
